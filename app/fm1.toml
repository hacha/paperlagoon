# PaperLagoon's build settings (fm1-base's tools/build.py: ./build.sh)
name = "PAPERLAGOON"           # the build's files: paperlagoon.fwsc, paperlagoon-X.Y.fwsc
id_prefix = "FM-1_1612"        # package identity (each firmware its own): dev FM-1_161200, releases FM-1_1612XXYYZZ
usb_manufacturer = "PaperLagoon"
usb_product = "PaperLagoon FM-1"
include = ["dsp"]
o2 = ["dsp/lagoon.c"]           # the engine, at -O2 (it #includes the plate and the echo)
words = "words.tsv"
ble = false                    # no radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
# the site
tagline = "Generative environmental music for the FM-1"
repo = "https://github.com/hacha/paperlagoon"
licence = "GPL-3.0-only"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments). Started from fm1-base's template by Charles Vestal; the voices' core, the plate and the tape echo come from his AMB-1 (MPL-2.0)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "hacha"
description = "PaperLagoon is a generative environmental-music firmware for the M-VAVE FM-1. FM voices through a tape echo and a plate play by themselves, in seven worlds that exist nowhere, each its own way of making music. You steer it from outside: the keys play no notes but offer something to a hidden state, which the music answers at once and then, slowly, for minutes. Soft broken chords and a muffled pulse can join it; a sleep timer lets it fall quiet."
tags = ["ambient", "generative", "fm"]
install = "https://hacha.github.io/paperlagoon/install/"
site = "https://hacha.github.io/paperlagoon/"
screenshot = "app/docs/img/screen-rings.png"
